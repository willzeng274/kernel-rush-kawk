name: Offline SM90 compiler inspection
on:
  push:
    branches: [codex/offline-sm90-compile-20260919]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned compiler only
        run: python -m pip install --disable-pip-version-check triton==3.1.0
      - name: Compile two frozen M64 gate-up WGMMA cases
        run: timeout 180s python tools/krxfty_wgmma_fresh_81/compile_gateup64.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sm90-compiler-evidence
          path: tools/krxfty_wgmma_fresh_81/compile-results/
          retention-days: 1
